---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: newt-init
  namespace: bfall-me
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: newt-init
  namespace: bfall-me
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: newt-init
  namespace: bfall-me
subjects:
  - kind: ServiceAccount
    name: newt-init
    namespace: bfall-me
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: newt-init
