apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
  labels:
    bfall.me/pangolin-visibility: public
spec:
  ingressClassName: pangolin
  rules:
    - host: ingress-test.bfall.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio
                port:
                  number: 80
