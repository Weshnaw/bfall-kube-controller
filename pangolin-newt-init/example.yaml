apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: homelab-kubernetes
  namespace: bfall-me
spec:
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: newt-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: newt-site
    spec:
      serviceAccountName: newt-init
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: newt-site
      initContainers:
        - name: site-register
          image: ghcr.io/weshnaw/bfall-kube-controller/pangolin-newt-init:master
          env:
            - name: PANGOLIN_API_KEY
              value: TODO
            - name: PANGOLIN_ORG
              value: bfall-me
            - name: PANGOLIN_ENDPOINT
              value: https://pangolin.bfall.me
            - name: PANGOLIN_SITE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: newt-config
              mountPath: /config
      containers:
        - name: newt
          image: docker.io/fosrl/newt:1.11.0
          env:
            - name: CONFIG_FILE
              value: /config/config.json
          volumeMounts:
            - name: newt-config
              mountPath: /config
  volumeClaimTemplates:
    - metadata:
        name: newt-config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Mi
